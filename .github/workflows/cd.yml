name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types:
      - completed

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image
    if: >
      github.event_name == 'workflow_run' && 
      github.event.workflow_run.conclusion == 'success' && 
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}

    steps:
      - name: Validate Release Target and Secrets
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          if [ "$REF_NAME" != "main" ]; then
            if ! echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: Reference '$REF_NAME' is neither 'main' nor a valid SemVer tag (vMAJOR.MINOR.PATCH)."
              exit 1
            fi
          fi
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Error: RENDER_API_KEY secret is missing. Cannot deploy."
            exit 1
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Error: RENDER_SERVICE_ID secret is missing. Cannot deploy."
            exit 1
          fi
          if [ -z "$PROD_HEALTH_URL" ]; then
            echo "Error: PROD_HEALTH_URL secret is missing. Cannot verify deployment."
            exit 1
          fi
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Log in to Docker Hub (Uncomment if using Docker Hub)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            # docker.io/${{ secrets.DOCKERHUB_USERNAME }}/docker-demo
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event.workflow_run.head_branch != 'main' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deployment via API
        id: deploy
        run: |
          IMAGE_URL="ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}"
          echo "Triggering deployment of $IMAGE_URL..."
          
          # Use -sS to hide progress but show errors, -w "%{http_code}" to capture status
          RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE_URL\"}")
          
          # Extract deploy ID using jq
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "Error: Deployment failed to trigger or API response was malformed."
            echo "Response was: $RESPONSE"
            exit 1
          fi
          
          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          echo "Successfully triggered deployment $DEPLOY_ID."

      - name: Verify Render Deployment API Status
        run: |
          echo "Polling Render API for deployment status of $DEPLOY_ID..."
          
          for i in {1..30}; do
            RESPONSE=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
              
            STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "live" ] || [ "$STATUS" = "success" ]; then
              echo "Deployment is live on Render."
              exit 0
            fi
            
            if echo "$STATUS" | grep -qi "failed\|canceled\|deactivated"; then
              echo "Error: Deployment ended in terminal state: $STATUS"
              exit 1
            fi
            
            echo "Waiting 15 seconds..."
            sleep 15
          done
          
          echo "Error: Deployment API polling timed out."
          exit 1

      - name: Verify Deployment Identity and Health
        run: |
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Waiting for deployment to complete and become healthy..."
          echo "Expected COMMIT_SHA: $EXPECTED_SHA"
          
          for i in {1..30}; do
            # Use -sS to hide progress bar but show errors if curl fails
            RESPONSE=$(curl -fsS "$PROD_HEALTH_URL" || echo "")
            if [ -n "$RESPONSE" ]; then
              # Robustly parse JSON using jq
              DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.commit // empty' || echo "parse_error")
              
              if [ "$DEPLOYED_SHA" = "parse_error" ] || [ -z "$DEPLOYED_SHA" ]; then
                 echo "Application is up, but health endpoint is missing commit identity or malformed."
              else
                 echo "Found deployed SHA: $DEPLOYED_SHA"
                 if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
                   echo "Deployment identity verified and application is healthy!"
                   exit 0
                 else
                   echo "Application is up but serving older version: $DEPLOYED_SHA"
                 fi
              fi
            fi
            echo "Waiting 10 seconds..."
            sleep 10
          done
          
          echo "Deployment verification timed out or identity mismatch."
          exit 1
