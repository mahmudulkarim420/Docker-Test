name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
      - features
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop
      - features

jobs:
  test-and-lint:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check TypeScript
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build TypeScript Output
        run: npm run build

  docker-check:
    name: Docker Build & Smoke Test
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Environment File
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: docker-demo:test
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: docker-demo:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Start Docker Compose Services
        run: BACKEND_IMAGE=docker-demo:test docker compose up -d --no-build

      - name: Wait for Application
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become healthy."
          docker compose logs
          exit 1

      - name: Verify Health Endpoint
        run: curl -f http://localhost:3000/health

      - name: Verify Database & Redis Dependencies
        run: curl -f http://localhost:3000/ready

      - name: Show Container Logs
        if: always()
        run: docker compose logs

      - name: Stop Docker Services
        if: always()
        run: docker compose down -v